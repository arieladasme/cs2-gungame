// GunGame overrides - CS2 execs this AFTER gamemode_casual.cfg on every map load,
// so values here beat the game-mode defaults (server.cfg alone runs too early).
// Same hook the old CSGO server used (see docs/CS2-GunGame-Paridad-CSGO.md).

// --- Identity ---
// The knife emoji is what sets the entry apart in the server browser; leading spaces
// were tried first and the browser trims them. The name lives here and not in the
// panel's SERVER_NAME variable because Pterodactyl trims that value too.
hostname "🔪 || GKS - GunGame Killers - 1.6 Style ||"
sv_tags "gungame,gg,chile,gks,1.6,37niveles,ffa,espanol"

// --- Match environment ---
// mp_maxrounds must stay non-zero. GunGame ends the match by reaching the last level, so 0
// looks like the honest value, but GG1MapChooser derives its remaining-rounds budget from it
// and 0 leaves it at "RemainingRounds 0": after any map change it then fires its end-of-map
// flow every tick, reloading the map a hundred times a minute. Measured: 0 -> 122 reloads in
// 35 s, 15 -> zero. The limit is never reached anyway because mp_roundtime is 60 minutes.
mp_maxrounds 15
mp_timelimit 0
mp_warmuptime 30
mp_freezetime 1
mp_roundtime 60
mp_startmoney 0
mp_buytime 0
mp_autokick 0
// En el nivel del taser el slot primario queda vacio, asi que cualquier arma en el
// piso se recoge caminando encima y rompe la progresion. Nada de armas sueltas.
mp_weapons_allow_map_placed 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
// mp_display_kill_assists only hides the column; the assist is still awarded and keeps
// adding up. Put the damage threshold out of reach so none is ever earned.
mp_display_kill_assists 0
cs_AssistDamageThreshold 9999
contributionscore_assist 0
sv_alltalk 0
mp_friendlyfire 0

// --- No economy ---
// mp_startmoney 0 only sets the opening balance; kills still pay out, so the scoreboard
// fills up with cash nobody can spend (mp_buytime is 0). Zero every award instead.
mp_maxmoney 0
mp_afterroundmoney 0
cash_player_killed_enemy_default 0
cash_player_killed_enemy_factor 0
cash_player_respawn_amount 0
cash_player_bomb_defused 0
cash_player_bomb_planted 0
cash_player_damage_hostage 0
cash_player_interact_with_hostage 0
cash_player_killed_hostage 0
cash_player_killed_teammate 0
cash_player_rescued_hostage 0
cash_team_elimination_bomb_map 0
cash_team_elimination_hostage_map_t 0
cash_team_elimination_hostage_map_ct 0
cash_team_hostage_alive 0
cash_team_hostage_interaction 0
cash_team_loser_bonus 0
cash_team_loser_bonus_consecutive_rounds 0
cash_team_planted_bomb_but_defused 0
cash_team_rescued_hostage 0
cash_team_terrorist_win_bomb 0
cash_team_win_by_defusing_bomb 0
cash_team_win_by_hostage_rescue 0
cash_team_win_by_time_running_out_hostage 0
cash_team_win_by_time_running_out_bomb 0

// --- Disk hygiene ---
// Container is capped at 80 GiB and CS2 alone takes 66.5, leaving ~13 free.
// GOTV demos are by far the fastest way to eat that margin, and this node has
// no SourceTV allocation anyway, so keep both instances off.
tv_enable 0
tv_enable1 0
tv_autorecord 0
