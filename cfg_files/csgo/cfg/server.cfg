// GunGame server config - parity with the old CSGO server.
// See docs/CS2-GunGame-Paridad-CSGO.md. Match cvars live in
// gamemode_casual_server.cfg: the game mode overwrites whatever this file sets.
// hostname is owned by the panel's SERVER_NAME startup variable, not set here.

// Bots (old server: quota 10 fill, easy, quiet)
bot_quota 16
bot_quota_mode fill
bot_difficulty 1
bot_chatter off
bot_join_after_player 1
bot_defer_to_human_guns 1
bot_defer_to_human_goals 1
