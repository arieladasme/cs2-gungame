// here are commands run on warmup start
// for example turn off the statistics during warmup
logaddress_delall
// Set here and not in gamemode_casual_server.cfg: on map load that file doesn't keep these, and GG2 runs
// these lines one by one after it on every map and restart.
// Without this CS2 prints "+$0 por neutralizar a un enemigo" on every kill, even with the cash awards at 0.
mp_playercashawards 0
mp_teamcashawards 0
// Friendly fire during warmup only, at full damage; gungame.warmupend.cfg turns it back off.
mp_friendlyfire 1
ff_damage_reduction_bullets 1
ff_damage_reduction_grenade 1
ff_damage_reduction_other 1
